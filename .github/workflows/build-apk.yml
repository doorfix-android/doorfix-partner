      - name: Install packages
        run: |
          npm install
          pip install pillow
      - name: Create the Android project
        run: npx cap add android
      - name: Add permissions, icons and push settings
        run: python3 tools/patch_android.py
      - name: Use the same signature on every build (new versions install over the old app)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: Sync plugins
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: DoorFix-Partner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
