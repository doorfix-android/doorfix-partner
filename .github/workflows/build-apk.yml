# DoorFix Partner: builds the Android app (APK) with background live location.
# Everything is inside this one file. You only add google-services.json next to it (see README).
name: Build DoorFix Partner APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the app files
        run: |
          mkdir -p www tools
          cat > package.json <<'EOF_PKG'
          {
            "name": "doorfix-partner",
            "version": "1.0.0",
            "private": true,
            "description": "DoorFix Partner Android app (staff app with background live location)",
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/app": "^6.0.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/push-notifications": "^6.0.0",
              "@capacitor/splash-screen": "^6.0.0",
              "@capacitor/status-bar": "^6.0.0",
              "@capacitor-community/background-geolocation": "^1.2.20"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CFG'
          {
            "appId": "com.doorfix.partner",
            "appName": "DoorFix Partner",
            "webDir": "www",
            "server": {
              "url": "https://doorfix-partner.cbabluu414.workers.dev/",
              "cleartext": false,
              "errorPath": "offline.html",
              "allowNavigation": [
                "doorfix-partner.cbabluu414.workers.dev",
                "*.firebaseapp.com",
                "*.google.com"
              ]
            },
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#FFFFFF",
              "useLegacyBridge": true
            },
            "plugins": {
              "SplashScreen": { "launchShowDuration": 500, "launchAutoHide": true, "backgroundColor": "#FFFFFF", "showSpinner": false, "androidScaleType": "CENTER_INSIDE" },
              "StatusBar": { "style": "LIGHT", "backgroundColor": "#FFFFFF", "overlaysWebView": false },
              "PushNotifications": { "presentationOptions": ["badge", "sound", "alert"] }
            }
          }
          EOF_CFG
          cat > www/index.html <<'EOF_IDX'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoorFix Partner</title></head><body style="font-family:sans-serif;text-align:center;padding:40px"><h2>DoorFix Partner</h2><p>Loading...</p></body></html>
          EOF_IDX
          cat > www/offline.html <<'EOF_OFF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoorFix Partner</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;color:#0F1B3D"><h2>No internet</h2><p>Check your connection, then close and reopen DoorFix Partner.</p></body></html>
          EOF_OFF
          cat > tools/patch_android.py <<'EOF_PY'
          import os, shutil, base64, io
          from PIL import Image, ImageDraw
          M = 'android/app/src/main/AndroidManifest.xml'
          s = open(M, encoding='utf8').read()
          perms = ['INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'ACCESS_BACKGROUND_LOCATION',
                   'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK', 'VIBRATE']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in perms if 'android.permission.%s"' % p not in s)
          assert '</manifest>' in s
          open(M, 'w', encoding='utf8').write(s.replace('</manifest>', add + '</manifest>'))
          print('manifest: permissions added')
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          base = Image.open('tools/icon.png').convert('RGBA')
          for dens, sz in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = res + '/mipmap-' + dens
              os.makedirs(d, exist_ok=True)
              im = base.resize((sz, sz), Image.LANCZOS); im.save(d + '/ic_launcher.png')
              mask = Image.new('L', (sz, sz), 0); ImageDraw.Draw(mask).ellipse((0, 0, sz - 1, sz - 1), fill=255)
              r = Image.new('RGBA', (sz, sz), (0, 0, 0, 0)); r.paste(im, (0, 0), mask); r.save(d + '/ic_launcher_round.png')
          os.makedirs(res + '/drawable', exist_ok=True)
          shutil.copy('tools/badge.png', res + '/drawable/ic_stat_notify.png')
          print('icons added')
          if os.path.exists('google-services.json'):
              shutil.copy('google-services.json', 'android/app/google-services.json'); print('google-services.json found: push notifications ON')
          else:
              print('WARNING: google-services.json is missing. The app builds, but push notifications will NOT work.')
          EOF_PY
